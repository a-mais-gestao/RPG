<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sombra dos Monstros — Mestre Digital v1</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-github-pages="true">
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><span>🐉</span><div><strong>Sombra dos Monstros</strong><small>Mestre Digital · v1</small></div></div>
      <button class="new-campaign" onclick="newCampaign()">＋ Nova campanha</button>
      <button class="nav-btn danger" style="width:100%;margin:8px 0 12px" onclick="resetAllSavedData()">🗑️ Apagar todos os dados</button>
      <nav id="nav">
        <button class="nav-btn active" data-view="campaigns">🗺️ Campanhas</button>
        <button class="nav-btn" data-view="party">👥 Grupo</button>
        <button class="nav-btn" data-view="character">🧙 Personagem</button>
        <button class="nav-btn" data-view="sheet">📜 Ficha</button>
        <button class="nav-btn" data-view="map">🌍 Mapa</button>
        <button class="nav-btn" data-view="tracking">🔎 Rastreamento</button>
        <button class="nav-btn" data-view="beast">🐲 Gerador de Besta</button>
        <button class="nav-btn" data-view="combat">⚔️ Combate</button>
        <button class="nav-btn" data-view="npcs">🎭 NPCs</button>
        <button class="nav-btn" data-view="tips">💡 Dicas do Mestre</button>
      </nav>
      <div class="sidebar-foot">Regras baseadas no Livro de Regras — Edição d20.</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">CAMPANHA</span><h1 id="pageTitle">Campanhas</h1></div>
        <div class="top-actions"><span id="campaignName" class="campaign-pill">Nenhuma campanha</span><label class="roll-mode-control" title="Define como o sistema resolve rolagens automáticas"><span>🎲 Rolagens</span><select id="rollModeSelect" onchange="setRollMode(this.value)"><option value="auto">🤖 Automáticas</option><option value="manual">✋ Mestre rola</option></select></label><button class="icon-btn" onclick="rollDice(20)">🎲 d20</button></div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="icon-system.js"></script>
</body>
</html>
